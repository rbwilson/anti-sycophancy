<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>anti-sycophancy — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page:       #07070a;
    --card:       #0d0d11;
    --border:     #1f1f26;
    --ink:        #ece9df;
    --ink-soft:   #cfcdc3;
    --ink-mute:   #8c8a7f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--page);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 40px;
  }

  .hero {
    width: 1600px;
    height: 720px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 80px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 40px 100px -40px rgba(0, 0, 0, 0.6);
  }

  .mask {
    height: 340px;
    width: auto;
    display: block;
    user-select: none;
  }

  .wordmark {
    margin-top: 36px;
    font-size: 72px;
    font-weight: 600;
    letter-spacing: -0.028em;
    line-height: 1;
    color: var(--ink);
  }

  .tagline {
    margin-top: 16px;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.005em;
    color: var(--ink-mute);
  }
</style>
</head>
<body>
  <div class="hero">
    <img class="mask" src="hannya.png" alt="anti-sycophancy mark">
    <div class="wordmark">anti-sycophancy</div>
    <div class="tagline">Calibrated, not polite.</div>
  </div>
</body>
</html>
